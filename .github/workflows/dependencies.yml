name: "Dependencies Example"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and npm
        uses: actions/setup-node@v7
        with:
          node-version: "14.x"
          cache: "npm"

      - name: Show content of folder
        run: ls -alhR
