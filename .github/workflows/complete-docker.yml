name: "Docker Example"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and npm
        uses: actions/setup-node@v7
        with:
          node-version: "14.x"
          cache: "npm"
      
      - name: Install dependencies
        run: npm install
      # run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Publish test and coverage report
        if: always()
        uses: mridang/action-test-reporter@v3
        with:
          name: Calculator Test Results
          #results-path: "**/junit.xml,**/test-results.json"
          coverage-path: "coverage/lcov.info"
          fail-on-error: true

      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
           username: ${{ vars.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
