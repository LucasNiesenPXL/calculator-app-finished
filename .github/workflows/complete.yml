name: "Build Example2"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and npm
        uses: actions/setup-node@v7
        with:
          node-version: "14.x"
          cache: "npm"
      
      - name: Install dependencies
        run: npm install
      # run: npm ci

      - name: Bundle code and node_modules into a zip
        run: zip -r app-bundle.zip . -x ".git/*" -x ".github/*"
          
      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Publish test and coverage report
        if: always()
        uses: mridang/action-test-reporter@v3
        with:
          name: Calculator Test Results
          #results-path: "**/junit.xml,**/test-results.json"
          coverage-path: "coverage/lcov.info"
          fail-on-error: true
