name: "Build Example2"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and npm
        uses: actions/setup-node@v7
        with:
          node-version: "14.x"
          cache: "npm"
      
      - name: Install dependencies
        run: npm install
      # run: npm ci

      - name: Bundle code and node_modules into a zip
        run: zip -r app-bundle.zip . -x ".git/*" -x ".github/*"

      - name: Run unit tests and generate report
        run: |
          mkdir -p reports
          npm test --if-present > reports/test-report.txt 2>&1
          cat reports/test-report.txt
