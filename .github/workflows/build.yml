name: "Build Example"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js and npm
        uses: actions/setup-node@v7
        with:
          node-version: "14.x"
          cache: "npm"
      
      - name: Install dependencies
        run: npm install

      - name: Build project (if build script exists)
        run: npm run build --if-present

      - name: Bundle code and node_modules into a zip
        run: zip -r app-bundle.zip . -x ".git/*" -x ".github/*"

      - name: Verify zip file
        run: ls -lh app-bundle.zip
      
